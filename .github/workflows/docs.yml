name: Docs

on:
  push:
    branches: [dev]
    paths:
      - 'src/**'
      - 'docs/**'
      - 'docs-site/**'
      - 'CHANGELOG.md'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root dependencies
        run: yarn install --frozen-lockfile

      - name: Install docs dependencies
        working-directory: docs-site
        run: yarn install --frozen-lockfile

      # If triggered by a release, archive the current docs as that version
      - name: Archive version (on release)
        if: github.event_name == 'release'
        run: bash .github/scripts/archive-docs-version.sh "${{ github.event.release.tag_name }}"

      # Update version strings in docs from package.json
      - name: Update version references
        run: |
          VERSION=$(node -p "require('./package.json').version")
          find docs-site/docs -name '*.md' -exec \
            sed -i "s/\*\*Version:\*\* [0-9]\+\.[0-9]\+\.[0-9]\+/**Version:** ${VERSION}/g" {} +

      - name: Build docs
        working-directory: docs-site
        run: yarn build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
