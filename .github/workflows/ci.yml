name: CI

on:
 push:
  branches: [main, dev]
 pull_request:
  branches: [main, dev]

permissions:
 contents: read

jobs:
 check:
  runs-on: ubuntu-latest
  strategy:
   fail-fast: false
   matrix:
    node-version: [22, 24]
  steps:
   - uses: actions/checkout@v7
     with:
      fetch-depth: 0

   - uses: oven-sh/setup-bun@v2

   - uses: actions/setup-node@v7
     with:
      node-version: ${{ matrix.node-version }}

   - run: bun install --frozen-lockfile

   - run: bun run check

   - run: bun run build

   - run: bun run examples:check
