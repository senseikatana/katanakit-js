# Trusted Publishing (OIDC) — no long-lived NPM_TOKEN needed.
# PREREQUISITE: configure trusted publishing on npmjs.com:
#   npmjs.com → Package Settings → Publishing access → Trusted publishing
#   → Add: repo=senseikatana/katanakit-js, workflow=release.yml, environment=(none)
# Without this, `npm publish --provenance` fails with 401/403.
#
# The workflow is the only path that bumps package.json, publishes to npm and
# creates the GitHub release + annotated tag. Manual `useGit release create`
# only creates a GitHub tag/release and does NOT publish to npm.
name: Release

on:
 workflow_dispatch:
  inputs:
   release-type:
    description: "Release type"
    required: true
    type: choice
    options:
     - patch
     - minor
     - major
   release-message:
    description: "Release message — becomes the tag and release title: 'vX.Y.Z — <message>'"
    required: false
    type: string

permissions:
 contents: write
 id-token: write

jobs:
 release:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
     with:
      fetch-depth: 0

   - name: Configure git identity
     run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

   - uses: oven-sh/setup-bun@v2

   - uses: actions/setup-node@v4
     with:
      node-version: 24
      registry-url: "https://registry.npmjs.org"

   - run: bun install --frozen-lockfile

   - run: bun run build

   - name: Bump version and tag
     env:
      RELEASE_MESSAGE: ${{ inputs.release-message }}
     run: node scripts/bump-version.mjs "${{ inputs.release-type }}" "$RELEASE_MESSAGE"

   - run: npm publish --provenance --access public

   - run: git push && git push --tags

   - name: Generate release notes
     run: |
      VERSION=$(node -p "require('./package.json').version")
      node scripts/generate-release-notes.mjs "v${VERSION}" --changelog > /tmp/release-notes.md

   - name: Create GitHub release
     env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_MESSAGE: ${{ inputs.release-message }}
     run: |
      VERSION=$(node -p "require('./package.json').version")
      TITLE="v${VERSION}"
      if [ -n "$RELEASE_MESSAGE" ]; then
        TITLE="v${VERSION} — ${RELEASE_MESSAGE}"
      fi
      gh release create "v${VERSION}" \
        --title "$TITLE" \
        --notes-file /tmp/release-notes.md
