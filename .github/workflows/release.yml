# Trusted Publishing (OIDC) — no long-lived NPM_TOKEN needed.
# PREREQUISITE: configure trusted publishing on npmjs.com:
#   npmjs.com → Package Settings → Publishing access → Trusted publishing
#   → Add: repo=senseikatana/katanakit-js, workflow=release.yml, environment=(none)
# Without this, `npm publish --provenance` fails with 401/403.
#
# Versioning uses npm's own `npm version` — there is no bump script: the tag is
# the source of truth, and `generate-release-notes.mjs --write` turns the
# commits since the previous tag into the CHANGELOG section.
#
# Backfill: dispatch with `publish-tag=vX.Y.Z` to publish a tag that already
# exists (release already created) without bumping, tagging or re-releasing.
name: Release

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: "Release type (ignored when publish-tag is set)"
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      release-message:
        description: "Release message — becomes the tag and release title: 'vX.Y.Z — <message>'"
        required: false
        type: string
      publish-tag:
        description: "Backfill: publish an existing tag to npm (e.g. v6.1.0) without bumping, tagging or creating a release"
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Checkout the tag to backfill
        if: inputs.publish-tag != ''
        run: |
          git checkout --detach "${{ inputs.publish-tag }}"

      - name: Check the tag before building
        if: inputs.publish-tag != ''
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "${{ inputs.publish-tag }}" ]; then
            echo "::error::package.json ($VERSION) does not match tag ${{ inputs.publish-tag }}"
            exit 1
          fi
          if npm view "katanakit-js@$VERSION" version >/dev/null 2>&1; then
            echo "::error::katanakit-js@$VERSION is already on npm"
            exit 1
          fi
          echo "Backfilling katanakit-js@$VERSION"

      - run: bun install --frozen-lockfile

      - name: Bump version and tag
        if: inputs.publish-tag == ''
        env:
          RELEASE_MESSAGE: ${{ inputs.release-message }}
          RELEASE_TYPE: ${{ inputs.release-type }}
        run: |
          if [ -z "$RELEASE_TYPE" ]; then
            echo "::error::release-type is required when publish-tag is not set"
            exit 1
          fi
          if [ -n "$RELEASE_MESSAGE" ]; then
            npm version "$RELEASE_TYPE" -m "v%s — $RELEASE_MESSAGE"
          else
            npm version "$RELEASE_TYPE" -m "chore: release v%s"
          fi

      - run: bun run build

      # `bun run build` ends with `--sync-versions`, which repoints package.json
      # at the newest tag in the repo — that would publish the wrong version.
      - name: Restore the tag's own version
        if: inputs.publish-tag != ''
        run: git checkout -- package.json README.md docs/guides

      - name: Verify the tag is publishable
        if: inputs.publish-tag != ''
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "${{ inputs.publish-tag }}" ]; then
            echo "::error::package.json ($VERSION) does not match tag ${{ inputs.publish-tag }}"
            exit 1
          fi
          if npm view "katanakit-js@$VERSION" version >/dev/null 2>&1; then
            echo "::error::katanakit-js@$VERSION is already on npm"
            exit 1
          fi
          echo "Backfilling katanakit-js@$VERSION"

      - name: Write CHANGELOG section and sync version refs
        if: inputs.publish-tag == ''
        run: node scripts/generate-release-notes.mjs "v$(node -p "require('./package.json').version")" --write

      - run: npm publish --provenance --access public

      - name: Commit changelog
        if: inputs.publish-tag == ''
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if git diff --quiet -- CHANGELOG.md README.md docs/guides; then
            echo "No changelog changes."
          else
            git add CHANGELOG.md README.md docs/guides
            git commit -m "docs: changelog for v${VERSION}"
          fi

      - if: inputs.publish-tag == ''
        run: git push && git push --tags

      - name: Generate release notes
        if: inputs.publish-tag == ''
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node scripts/generate-release-notes.mjs "v${VERSION}" --changelog > /tmp/release-notes.md

      - name: Create GitHub release
        if: inputs.publish-tag == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_MESSAGE: ${{ inputs.release-message }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TITLE="v${VERSION}"
          if [ -n "$RELEASE_MESSAGE" ]; then
            TITLE="v${VERSION} — ${RELEASE_MESSAGE}"
          fi
          gh release create "v${VERSION}" \
            --title "$TITLE" \
            --notes-file /tmp/release-notes.md
