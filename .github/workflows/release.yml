# Trusted Publishing (OIDC) — no long-lived NPM_TOKEN needed.
# PREREQUISITE: configure trusted publishing on npmjs.com:
#   npmjs.com → Package Settings → Publishing access → Trusted publishing
#   → Add: repo=senseikatana/katanakit-js, workflow=release.yml, environment=(none)
# Without this, `npm publish --provenance` fails with 401/403.
#
# Versioning uses npm's own `npm version` — there is no bump script: the tag is
# the source of truth, and `generate-release-notes.mjs --write` turns the
# commits since the previous tag into the CHANGELOG section.
#
# Backfill: dispatch with `publish-tag=vX.Y.Z` to publish a tag that already
# exists (release already created) without bumping, tagging or re-releasing.
name: Release

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: "Release type (ignored when publish-tag is set)"
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      release-message:
        description: "Release message — becomes the tag and release title: 'vX.Y.Z — <message>'"
        required: false
        type: string
      publish-tag:
        description: "Backfill: publish an existing tag to npm (e.g. v6.1.0) without bumping, tagging or creating a release"
        required: false
        type: string
      remove-dist-tag:
        description: "Maintenance: remove a temporary dist-tag (e.g. backfill) instead of running a release"
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  remove-dist-tag:
    if: inputs.remove-dist-tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: Remove dist-tag
        env:
          DIST_TAG: ${{ inputs.remove-dist-tag }}
        run: |
          echo "before: $(npm dist-tag ls katanakit-js | tr '\n' ' ')"
          npm dist-tag rm katanakit-js "$DIST_TAG"
          echo "after: $(npm dist-tag ls katanakit-js | tr '\n' ' ')"

  release:
    if: inputs.remove-dist-tag == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Checkout the tag to backfill
        if: inputs.publish-tag != ''
        run: |
          git checkout --detach "${{ inputs.publish-tag }}"

      - name: Check the tag is not already on npm
        if: inputs.publish-tag != ''
        env:
          PUBLISH_TAG: ${{ inputs.publish-tag }}
        run: |
          VERSION="${PUBLISH_TAG#v}"
          NAME=$(node -p "require('./package.json').name")
          if [ "$NAME" != "katanakit-js" ]; then
            echo "::error::$PUBLISH_TAG ships package name '$NAME', not katanakit-js — skip it"
            exit 1
          fi
          if npm view "katanakit-js@$VERSION" version >/dev/null 2>&1; then
            echo "::error::katanakit-js@$VERSION is already on npm"
            exit 1
          fi
          echo "Will backfill katanakit-js@$VERSION"

      - run: bun install --frozen-lockfile

      - name: Bump version and tag
        if: inputs.publish-tag == ''
        env:
          RELEASE_MESSAGE: ${{ inputs.release-message }}
          RELEASE_TYPE: ${{ inputs.release-type }}
        run: |
          if [ -z "$RELEASE_TYPE" ]; then
            echo "::error::release-type is required when publish-tag is not set"
            exit 1
          fi
          if [ -n "$RELEASE_MESSAGE" ]; then
            npm version "$RELEASE_TYPE" -m "v%s — $RELEASE_MESSAGE"
          else
            npm version "$RELEASE_TYPE" -m "chore: release v%s"
          fi

      - name: Build the tag's own sources
        if: inputs.publish-tag != ''
        run: |
          if bun run build; then
            echo "Built with the tag's own build script"
          else
            # Legacy tags call pnpm (v3.x) or other tooling that is not on the runner.
            echo "::warning::tag build script failed — compiling directly with tsc"
            rm -rf dist
            if [ -x node_modules/.bin/tsc6 ]; then TSC=node_modules/.bin/tsc6
            elif [ -x node_modules/.bin/tsc ]; then TSC=node_modules/.bin/tsc
            else echo "::error::no TypeScript compiler in node_modules/.bin"; exit 1; fi
            "$TSC" -p tsconfig.json
          fi
          if [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "::error::dist/ is empty after build"
            exit 1
          fi
          echo "dist/ has $(ls dist | wc -l) entries"

      - name: Build and sync versions
        if: inputs.publish-tag == ''
        run: bun run build

      # `bun run build` ends with `--sync-versions`, which repoints package.json at
      # the newest tag in the repo. Restore the tag's own files (paths that did not
      # exist yet on old tags are skipped), then pin the version to the tag name:
      # several 6.x tags were cut before the bump, so the package.json inside them
      # lags (v6.1.0 carries 6.0.6).
      - name: Restore tag content and pin the published version
        if: inputs.publish-tag != ''
        env:
          PUBLISH_TAG: ${{ inputs.publish-tag }}
        run: |
          for path in package.json README.md docs/guides; do
            git checkout -- "$path" 2>/dev/null || true
          done
          node <<'EOF'
          const fs = require("node:fs");
          const tag = process.env.PUBLISH_TAG;
          const version = tag.replace(/^v/, "");
          const REPO = "git+https://github.com/senseikatana/katanakit-js.git";
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          if (pkg.version !== version) {
            console.log(`::warning::package.json at ${tag} says ${pkg.version} — pinning to ${version}`);
          }
          pkg.version = version;
          // Provenance rejects tags cut before the repo was renamed to katanakit-js.
          const url = pkg.repository && pkg.repository.url;
          if (url !== REPO) {
            console.log(`::warning::repository.url was ${url || "(none)"} — normalizing to ${REPO}`);
            pkg.repository = { type: "git", url: REPO };
          }
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, "\t") + "\n");
          console.log(`package.json pinned to ${version}`);
          EOF

      - name: Verify the pinned version before publishing
        if: inputs.publish-tag != ''
        env:
          PUBLISH_TAG: ${{ inputs.publish-tag }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$PUBLISH_TAG" ]; then
            echo "::error::package.json ($VERSION) does not match tag $PUBLISH_TAG"
            exit 1
          fi
          if npm view "katanakit-js@$VERSION" version >/dev/null 2>&1; then
            echo "::error::katanakit-js@$VERSION is already on npm"
            exit 1
          fi
          echo "Publishing katanakit-js@$VERSION from $PUBLISH_TAG"

      - name: Write CHANGELOG section and sync version refs
        if: inputs.publish-tag == ''
        run: node scripts/generate-release-notes.mjs "v$(node -p "require('./package.json').version")" --write

      # A backfilled version is normally older than `latest`, and npm refuses to
      # move `latest` backwards — publish it under a side dist-tag instead.
      - name: npm publish (backfill)
        if: inputs.publish-tag != ''
        env:
          PUBLISH_TAG: ${{ inputs.publish-tag }}
        run: |
          VERSION="${PUBLISH_TAG#v}"
          LATEST=$(npm view katanakit-js dist-tags.latest 2>/dev/null || true)
          if [ -n "$LATEST" ] && [ "$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -1)" = "$VERSION" ]; then
            TAG=latest
          else
            TAG=backfill
          fi
          echo "publishing $VERSION with dist-tag '$TAG' (current latest: ${LATEST:-none})"
          # --ignore-scripts: old tags carry a prepublishOnly that re-runs their
          # own check/test/build with tooling that no longer exists on the runner.
          if npm publish --provenance --access public --tag "$TAG" --ignore-scripts; then
            exit 0
          fi
          # A previous failed attempt for the same tag can leave its attestation in
          # the sigstore log, which then returns 409. Retry without provenance:
          # authentication still happens through the OIDC trusted publisher.
          echo "::warning::publishing $VERSION without provenance"
          npm publish --provenance=false --access public --tag "$TAG" --ignore-scripts

      - name: npm publish
        if: inputs.publish-tag == ''
        run: npm publish --provenance --access public

      - name: Commit changelog
        if: inputs.publish-tag == ''
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if git diff --quiet -- CHANGELOG.md README.md docs/guides; then
            echo "No changelog changes."
          else
            git add CHANGELOG.md README.md docs/guides
            git commit -m "docs: changelog for v${VERSION}"
          fi

      - if: inputs.publish-tag == ''
        run: git push && git push --tags

      - name: Generate release notes
        if: inputs.publish-tag == ''
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node scripts/generate-release-notes.mjs "v${VERSION}" --changelog > /tmp/release-notes.md

      - name: Create GitHub release
        if: inputs.publish-tag == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_MESSAGE: ${{ inputs.release-message }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TITLE="v${VERSION}"
          if [ -n "$RELEASE_MESSAGE" ]; then
            TITLE="v${VERSION} — ${RELEASE_MESSAGE}"
          fi
          gh release create "v${VERSION}" \
            --title "$TITLE" \
            --notes-file /tmp/release-notes.md
